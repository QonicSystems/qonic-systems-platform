<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Page not found · Qonic Systems</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root { --accent: #ffd700; --ease: cubic-bezier(.22, 1, .36, 1); }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; overflow: hidden; position: relative;
      background: #0c0c0c; color: #fff; text-align: center;
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 1.5rem;
    }
    body::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 38%, rgba(255,215,0,.16), transparent 46%); }
    .wrap { position: relative; z-index: 1; }
    .tag { margin: 0 0 .4rem; color: var(--accent); font-weight: 700; font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; }
    .code { font-weight: 800; color: var(--accent); font-size: clamp(6.5rem, 26vw, 16rem); line-height: .9; letter-spacing: -.05em; text-shadow: 0 8px 40px rgba(255,215,0,.25); }
    h1 { margin: 1.2rem 0 0; color: #fff; font-weight: 800; font-size: clamp(1.7rem, 5vw, 2.7rem); letter-spacing: -.03em; }
    p { margin: 1rem auto 0; max-width: 32rem; color: #b6b6b6; font-size: 1.08rem; line-height: 1.6; }
    .btn { display: inline-flex; align-items: center; margin-top: 2.4rem; border: 1px solid rgba(255,255,255,.25); border-radius: .8rem;
      padding: .85rem 1.6rem; color: #fff; font-weight: 700; text-decoration: none; transition: transform .25s var(--ease), border-color .2s, color .2s; }
    .btn:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="tag">Error 404</p>
    <div class="code" aria-hidden="true">404</div>
    <h1>Well, this is awkward.</h1>
    <p>That page wandered off and didn't leave a forwarding address. Even our GPS looks confused. Let's get you back to solid ground.</p>
    <a class="btn" href="/">← Back to Qonic Systems</a>
  </div>
</body>
</html>
